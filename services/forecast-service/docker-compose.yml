services:
  forecast:
    build: .
    image: meteotrace/forecast-service:0.1.0
    ports:
      - "8000:8000"
    environment:
      FORECAST_CACHE_TTL: "600"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5
